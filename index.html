<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mai - Turn Screen Time into Study Time</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 48px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { font-size: 64px; margin-bottom: 16px; }
        h1 { font-size: 32px; color: #1a1a2e; margin-bottom: 8px; }
        .tagline { color: #666; font-size: 18px; margin-bottom: 32px; }
        .features {
            text-align: left;
            margin: 32px 0;
            padding: 24px;
            background: #f8f9fa;
            border-radius: 16px;
        }
        .feature { padding: 12px 0; display: flex; align-items: center; gap: 12px; }
        .feature-icon { font-size: 24px; }
        .links { margin-top: 32px; display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
        .links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .links a:hover { text-decoration: underline; }
        .app-store {
            display: inline-block;
            margin-top: 24px;
            padding: 16px 32px;
            background: #000;
            color: white;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
        }

</head>

    <div class="container">

            </div>
            <div class="feature">

                <span>Smart flashcards that adapt to your learning</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🎤</span>
                <span>Speaking quizzes for active recall</span>
            </div>
            <div class="feature">
                <span class="feature-icon">⏰</span>

        <a href="#" class="app-store">Download on the App Store</a>
        
        <div class="links">
